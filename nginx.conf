events {
    worker_connections 1024;
}

http {
    # Necessário para o Nginx entender que um .css é CSS e um .js é JS
    include       mime.types;
    default_type  application/octet-stream;

    # Otimizações de performance
    sendfile        on;
    keepalive_timeout  65;
    
    # Compressão para deixar o React mais rápido
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proteção básica contra sobrecarga (Rate Limiting)
    limit_req_zone $binary_remote_addr zone=limite_api:10m rate=10r/s;

    server {
        listen 80;
        
        # Pode colocar o seu domínio real aqui depois (ex: sge.radaptech.com.br)
        server_name *.radaptech.com.br; 

        # ---------------------------------------------------------
        # 1. FRONTEND (Servindo o React compilado)
        # ---------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            
            # O PULO DO GATO DO REACT ROUTER:
            # Se a pessoa acessar /dashboard direto na URL, o Nginx vai procurar um arquivo dashboard.html (que não existe e daria erro 404).
            # O try_files redireciona tudo de volta pro index.html para o React assumir as rotas.
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------
        # 2. BACKEND (Roteando para a API Go)
        # ---------------------------------------------------------
        location /api/ {
            limit_req zone=limite_api burst=20 nodelay;
            
            # Aponta para o container do Go (nomeado como 'api')
            proxy_pass http://api_epi:8080/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------------------------------------------------------
        # 3. WEBSOCKETS (Para notificações/tempo real)
        # ---------------------------------------------------------
        location /ws {
            proxy_pass http://api_epi:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}