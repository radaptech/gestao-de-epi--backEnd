basePath: /api
definitions:
  helper.HTTPError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  model.Departamento:
    properties:
      departamento:
        maxLength: 50
        type: string
    required:
    - departamento
    type: object
  model.DepartamentoDto:
    properties:
      departamento:
        example: Recursos Humanos
        type: string
      id:
        type: integer
    type: object
  model.DevolucaoInserir:
    properties:
      assinatura_digital:
        description: Outros campos do Payload
        type: string
      data_devolucao:
        type: string
      houve_troca:
        type: boolean
      idEpi:
        type: integer
      idEpiNovo:
        description: Campos de Troca (Podem ser nulos no JS)
        type: integer
      idFuncionario:
        description: Campos Obrigatórios (binding:"required")
        type: integer
      idMotivo:
        type: integer
      idTamanho:
        type: integer
      idTamanhoNovo:
        type: integer
      observacao:
        type: string
      quantidadeADevolver:
        type: integer
      quantidadeNova:
        type: integer
    required:
    - assinatura_digital
    - data_devolucao
    - idEpi
    - idFuncionario
    - idMotivo
    - idTamanho
    - quantidadeADevolver
    type: object
  model.DevolucaoResponse:
    properties:
      assinatura_digital:
        description: Ponteiro pois pode estar pendente
        type: string
      data_devolucao:
        description: Formato ISO ou DD/MM/YYYY
        type: string
      epiNome:
        type: string
      epiNovoNome:
        description: Ponteiro pois pode ser null se não houver troca
        type: string
      funcionarioMatricula:
        type: integer
      funcionarioNome:
        type: string
      houveTroca:
        type: boolean
      id:
        type: integer
      idFuncionario:
        type: integer
      motivoNome:
        type: string
      observacao:
        description: Ponteiro pois é opcional
        type: string
      quantidadeADevolver:
        type: integer
      quantidadeNova:
        description: Ponteiro pois pode ser null
        type: integer
      tamanhoNome:
        type: string
      tamanhoNovoNome:
        description: Ponteiro pois pode ser null
        type: string
      token_validacao:
        description: Ponteiro pois pode estar pendente
        type: string
    type: object
  model.EditarEmpresaRequest:
    properties:
      cnpj:
        type: string
      email:
        type: string
      nome:
        type: string
      observacoes:
        type: string
      planoId:
        type: integer
      responsavel:
        type: string
      status:
        type: string
      telefone:
        type: string
      vencimento:
        type: string
    required:
    - email
    - nome
    - planoId
    - responsavel
    - status
    type: object
  model.Empresa:
    properties:
      cnpj:
        type: string
      email:
        type: string
      epis:
        type: integer
      funcionarios:
        type: integer
      id:
        type: integer
      mensalidade:
        type: number
      nome:
        type: string
      observacoes:
        type: string
      plano:
        type: string
      responsavel:
        type: string
      status:
        type: string
      telefone:
        type: string
      vencimento:
        type: string
    type: object
  model.EmpresaInserir:
    properties:
      cnpj:
        maxLength: 40
        type: string
      email:
        maxLength: 40
        type: string
      nome_fantasia:
        type: string
      observacoes:
        maxLength: 150
        type: string
      plano:
        type: string
      responsavel:
        maxLength: 40
        type: string
      status:
        type: string
      telefone:
        maxLength: 40
        type: string
      vencimento:
        type: string
    required:
    - cnpj
    - email
    - nome_fantasia
    - plano
    - responsavel
    - status
    - vencimento
    type: object
  model.EmpresaRecente:
    properties:
      epis:
        type: integer
      funcionarios:
        type: integer
      id:
        type: integer
      mensalidade:
        type: number
      nome:
        type: string
      plano:
        type: string
      responsavel:
        type: string
      status:
        type: string
      subdominio:
        type: string
    type: object
  model.EntradaDashbord:
    properties:
      dataEntrada:
        description: Usa o helper para garantir o ponteiro da data formatada
        type: string
      id:
        type: integer
      idEpi:
        type: integer
      idTamanho:
        type: integer
      lote:
        type: string
      quantidade:
        type: integer
      quantidadeAtual:
        type: integer
      valorUnitario:
        type: number
    type: object
  model.EntradaEpiDto:
    properties:
      data_entrada:
        description: 2. Linha do tempo
        type: string
      epi:
        allOf:
        - $ref: '#/definitions/model.EpiSimples'
        description: 4. Objetos completos (Relacionamentos)
      fornecedor:
        $ref: '#/definitions/model.FornecedorSimples'
      id:
        type: integer
      id_epi:
        type: integer
      id_fornecedor:
        type: integer
      id_tamanho:
        type: integer
      lote:
        type: string
      nota_fiscal_numero:
        type: string
      nota_fiscal_serie:
        type: string
      quantidade:
        description: 3. Valores e informações da operação
        type: integer
      quantidade_atual:
        type: integer
      tamanho:
        $ref: '#/definitions/model.TamanhoSimples'
      usuario:
        type: string
      valor_unitario:
        type: number
    type: object
  model.EntradaEpiInserir:
    properties:
      data_emissao:
        type: string
      idfornecedor:
        type: integer
      itens:
        description: '"dive" valida cada item da lista'
        items:
          $ref: '#/definitions/model.EntradaEpiItemInserir'
        type: array
      nota_fiscal_numero:
        maxLength: 50
        type: string
      nota_fiscal_serie:
        maxLength: 20
        type: string
    required:
    - data_emissao
    - idfornecedor
    - itens
    - nota_fiscal_numero
    - nota_fiscal_serie
    type: object
  model.EntradaEpiItemInserir:
    properties:
      data_fabricacao:
        type: string
      data_validade:
        type: string
      id_epi:
        type: integer
      id_tamanho:
        type: integer
      lote:
        maxLength: 50
        type: string
      quantidade:
        type: integer
      valor_unitario:
        type: number
    required:
    - data_fabricacao
    - data_validade
    - id_epi
    - id_tamanho
    - lote
    - quantidade
    - valor_unitario
    type: object
  model.EntradaEstoqueDto:
    properties:
      data_entrada:
        type: string
      data_validade:
        type: string
      epi:
        $ref: '#/definitions/model.EpiDtoEstoque'
      id:
        type: integer
      lote:
        type: string
      quantidade_atual:
        type: integer
      quantidade_inicial:
        type: integer
      tamanho:
        $ref: '#/definitions/model.TamanhoDto'
      valor_unitario:
        type: number
    type: object
  model.EntregaDashbord:
    properties:
      assinatura:
        type: string
      data_entrega:
        type: string
      id:
        type: integer
      id_funcionario:
        type: integer
      token_validacao:
        type: string
    type: object
  model.EntregaDoFuncionarioDto:
    properties:
      assinatura_digital:
        type: string
      data_entrega:
        type: string
      id:
        type: integer
      itens:
        description: <-- AQUI ELA!
        items:
          $ref: '#/definitions/model.ItemEntregueDto'
        type: array
    type: object
  model.EntregaDto:
    properties:
      assinatura_digital:
        type: string
      data_entrega:
        type: string
      funcionario:
        $ref: '#/definitions/model.Funcionario_Dto'
      id:
        type: integer
      id_user:
        type: integer
      itens:
        items:
          $ref: '#/definitions/model.ItemEntregueDto'
        type: array
      token_validacao:
        type: string
    type: object
  model.EntregaItensDashBord:
    properties:
      id:
        type: integer
      id_entrega_cabecalho:
        type: integer
      id_epi:
        type: integer
      id_tamanho:
        type: integer
      quantidade:
        type: integer
    type: object
  model.EntregaParaInserir:
    properties:
      assinatura_digital:
        type: string
      data_entrega:
        type: string
      id_funcionario:
        type: integer
      id_troca:
        description: Usei ponteiro para aceitar nulo
        type: integer
      id_user:
        type: integer
      itens:
        items:
          $ref: '#/definitions/model.ItemParaInserir'
        minItems: 1
        type: array
    required:
    - assinatura_digital
    - data_entrega
    - id_funcionario
    - itens
    type: object
  model.EpiDashBord:
    properties:
      alerta_minimo:
        type: integer
      id:
        type: integer
      nome:
        type: string
    type: object
  model.EpiDto:
    properties:
      alerta_minimo:
        type: integer
      ca:
        type: string
      descricao:
        type: string
      fabricante:
        type: string
      id:
        type: integer
      nome:
        type: string
      protecao:
        $ref: '#/definitions/model.TipoProtecaoDto'
      tamanhos:
        description: Slive de objetos Tamanho (id e nome)
        items:
          $ref: '#/definitions/model.TamanhoDto'
        type: array
      validade_ca:
        type: string
    type: object
  model.EpiDtoDevolucao:
    properties:
      alerta_minimo:
        type: integer
      ca:
        type: string
      descricao:
        type: string
      fabricante:
        type: string
      id:
        type: integer
      nome:
        type: string
      protecao:
        $ref: '#/definitions/model.TipoProtecaoDto'
      saldoAtual:
        type: integer
      tamanhos:
        description: Slive de objetos Tamanho (id e nome)
        items:
          $ref: '#/definitions/model.TamanhoDto'
        type: array
      validade_ca:
        type: string
    type: object
  model.EpiDtoEstoque:
    properties:
      alertaMinimo:
        type: integer
      ca:
        type: string
      descricao:
        type: string
      fabricante:
        type: string
      id:
        type: integer
      nome:
        type: string
      protecao:
        $ref: '#/definitions/model.TipoProtecaoDto'
      validadeCa:
        type: string
    type: object
  model.EpiInserir:
    properties:
      alerta_minimo:
        minimum: 0
        type: integer
      ca:
        maxLength: 20
        type: string
      data_validade_ca:
        type: string
      descricao:
        maxLength: 250
        type: string
      fabricante:
        maxLength: 100
        type: string
      id_protecao:
        type: integer
      id_tamanho:
        description: Lista de tamanhos permitidos para este EPI
        items:
          type: integer
        minItems: 1
        type: array
      nome:
        type: string
    required:
    - alerta_minimo
    - ca
    - data_validade_ca
    - fabricante
    - id_protecao
    - id_tamanho
    - nome
    type: object
  model.EpiResponse:
    properties:
      alerta_minimo:
        type: integer
      ca:
        type: string
      descricao:
        type: string
      fabricante:
        type: string
      id:
        type: integer
      nome:
        type: string
      protecao:
        $ref: '#/definitions/model.TipoProtecaoDto'
      validade_ca:
        type: string
    type: object
  model.EpiSimples:
    properties:
      ca:
        type: string
      fabricante:
        type: string
      id:
        type: integer
      nome:
        type: string
    type: object
  model.FornecedorSimples:
    properties:
      id:
        type: integer
      nome_fantasia:
        type: string
      razao_social:
        type: string
    type: object
  model.Funcao:
    properties:
      funcao:
        maxLength: 50
        type: string
      id_departamento:
        minimum: 1
        type: integer
    required:
    - funcao
    - id_departamento
    type: object
  model.FuncaoDto:
    properties:
      cargo:
        type: string
      departamento:
        $ref: '#/definitions/model.DepartamentoDto'
      id:
        type: integer
    type: object
  model.Funcionario_Dto:
    properties:
      cpf:
        type: string
      funcao:
        $ref: '#/definitions/model.FuncaoDto'
      id:
        type: integer
      matricula:
        type: string
      nome:
        type: string
    type: object
  model.FuncionarioCompletoDto:
    properties:
      cpf:
        type: string
      entregas:
        items:
          $ref: '#/definitions/model.EntregaDoFuncionarioDto'
        type: array
      funcao:
        $ref: '#/definitions/model.FuncaoDto'
      id:
        type: integer
      matricula:
        type: string
      nome:
        type: string
    type: object
  model.FuncionarioDashbord:
    properties:
      id:
        type: integer
      matricula:
        type: string
      nome:
        type: string
    type: object
  model.FuncionarioInserir:
    properties:
      cpf:
        type: string
      id_departamento:
        minimum: 1
        type: integer
      id_funcao:
        minimum: 1
        type: integer
      nome:
        maxLength: 150
        minLength: 3
        type: string
    required:
    - cpf
    - id_departamento
    - id_funcao
    - nome
    type: object
  model.ItemEntregueDto:
    properties:
      epi:
        $ref: '#/definitions/model.EpiResponse'
      id:
        type: integer
      quantidade:
        type: integer
      tamanho:
        $ref: '#/definitions/model.TamanhoDto'
    type: object
  model.ItemParaInserir:
    properties:
      id_entrada_item:
        description: "\U0001F511 NOVO: Precisamos saber de qual lote saiu!"
        type: integer
      id_epi:
        type: integer
      id_tamanho:
        type: integer
      quantidade:
        type: integer
    required:
    - id_epi
    - id_tamanho
    - quantidade
    type: object
  model.ResumoDashboard:
    properties:
      empresasAtivas:
        type: integer
      empresasBloqueadas:
        type: integer
      empresasEmTeste:
        type: integer
      receitaMensal:
        type: number
      totalEmpresas:
        type: integer
      totalEntregas:
        type: integer
      totalEpis:
        type: integer
      totalFuncionarios:
        type: integer
    type: object
  model.TamanhoDto:
    properties:
      id:
        type: integer
      tamanho:
        type: string
    type: object
  model.TamanhoSimples:
    properties:
      id:
        type: integer
      tamanho:
        type: string
    type: object
  model.TipoProtecaoDto:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  model.UpdateEpiInput:
    properties:
      alerta_minimo:
        type: integer
      ca:
        type: string
      descricao:
        type: string
      fabricante:
        type: string
      id_protecao:
        type: integer
      nome:
        type: string
      tamanhos:
        description: Se enviado, você deve resetar os tamanhos no banco
        items:
          type: integer
        type: array
      validade_ca:
        type: string
    type: object
  model.UpdateFuncionarioRequest:
    properties:
      cpf:
        type: string
      id_departamento:
        type: integer
      id_funcao:
        type: integer
      nome:
        type: string
    type: object
  service.DepartamentoPaginado:
    properties:
      departamentos:
        items:
          $ref: '#/definitions/model.DepartamentoDto'
        type: array
      pagina:
        type: integer
      paginaFinal:
        type: integer
      total:
        type: integer
    type: object
  service.EntradaPaginada:
    properties:
      entradas:
        items:
          $ref: '#/definitions/model.EntradaEpiDto'
        type: array
      pagina:
        type: integer
      pagina_final:
        type: integer
      total:
        type: integer
    type: object
  service.EntregaPaginada:
    properties:
      entregas:
        items:
          $ref: '#/definitions/model.EntregaDto'
        type: array
      pagina:
        type: integer
      pagina_final:
        type: integer
      total:
        type: integer
    type: object
  service.EpiPaginado:
    properties:
      epis:
        items:
          $ref: '#/definitions/model.EpiDto'
        type: array
      pagina:
        format: int32
        type: integer
      paginaFinal:
        format: int32
        type: integer
      total:
        format: int64
        type: integer
    type: object
  service.FuncionarioPaginado:
    properties:
      funcionario:
        items:
          $ref: '#/definitions/model.Funcionario_Dto'
        type: array
      pagina:
        type: integer
      paginaFinal:
        type: integer
      total:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: suporte@seusaas.com.br
    name: Suporte API
    url: http://www.radaptech.com.br
  description: API para gestão de EPIs.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: SaaS EPI API
  version: "1.0"
paths:
  /cadastro-departamento:
    post:
      consumes:
      - application/json
      description: Cadastra um novo departamento no sistema
      parameters:
      - description: Dados do departamento
        in: body
        name: departamento
        required: true
        schema:
          $ref: '#/definitions/model.Departamento'
      produces:
      - application/json
      responses:
        "201":
          description: Departamento criado
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "409":
          description: Departamento já existe
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "500":
          description: Erro interno
          schema:
            $ref: '#/definitions/helper.HTTPError'
      security:
      - BearerAuth: []
      summary: Criar novo departamento
      tags:
      - Departamentos
  /cadastro-funcao:
    post:
      consumes:
      - application/json
      description: Cadastra uma nova funcao no sistema
      parameters:
      - description: Dados da funcao
        in: body
        name: funcao
        required: true
        schema:
          $ref: '#/definitions/model.Funcao'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "409":
          description: id de departamento nao existe no sistema
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "500":
          description: Erro interno
          schema:
            $ref: '#/definitions/helper.HTTPError'
      security:
      - BearerAuth: []
      summary: Criar uma funcao
      tags:
      - funcao
  /cadastro-funcionario:
    post:
      consumes:
      - application/json
      description: Cadastra um novo funcionário no sistema
      parameters:
      - description: Dados do funcionário
        in: body
        name: funcionario
        required: true
        schema:
          $ref: '#/definitions/model.FuncionarioInserir'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "409":
          description: Matrícula/Dados duplicados
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "500":
          description: Erro interno
          schema:
            $ref: '#/definitions/helper.HTTPError'
      security:
      - BearerAuth: []
      summary: Cadastrar novo funcionário
      tags:
      - Funcionários
  /dashboard:
    get:
      description: Retorna o resumo para o dashboard da empresa
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResumoDashboard'
        "500":
          description: Erro interno
          schema:
            $ref: '#/definitions/helper.HTTPError'
      security:
      - BearerAuth: []
      summary: Dashboard
      tags:
      - Empresas
  /departamento/{id}:
    delete:
      description: Remove um departamento pelo ID
      parameters:
      - description: ID do Departamento
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Sem Conteúdo
        "400":
          description: ID inválido
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "404":
          description: Não encontrado
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "500":
          description: Erro interno
          schema:
            $ref: '#/definitions/helper.HTTPError'
      security:
      - BearerAuth: []
      summary: Deletar departamento
      tags:
      - Departamentos
  /departamentos:
    get:
      description: Retorna uma lista paginada de departamentos
      parameters:
      - description: Página da lista
        in: query
        name: pagina
        type: integer
      - description: Quantidade por página
        in: query
        name: quantidade
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.DepartamentoPaginado'
        "400":
          description: Parâmetros inválidos
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "500":
          description: Erro interno
          schema:
            $ref: '#/definitions/helper.HTTPError'
      security:
      - BearerAuth: []
      summary: Listar departamentos
      tags:
      - Departamentos
  /departamentos/{id}:
    put:
      consumes:
      - application/json
      description: Atualiza o nome de um departamento existente
      parameters:
      - description: ID do Departamento
        in: path
        name: id
        required: true
        type: integer
      - description: Dados do departamento
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.Departamento'
      produces:
      - application/json
      responses:
        "200":
          description: Sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Erro de validação
          schema:
            $ref: '#/definitions/helper.HTTPError'
        "404":
