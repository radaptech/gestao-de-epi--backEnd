events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=limite_api:10m rate=5r/s;
    limit_req_status 429;

    # ---------------------------------------------------------
    # 1. HOMOLOGAÇÃO: API de Testes (homolog.radaptech.com.br)
    # ---------------------------------------------------------
    server {
        listen 80;
        server_name homolog.radaptech.com.br;

        location /api/ {
            limit_req zone=limite_api burst=10 nodelay;
            proxy_pass http://gestao-de-epi--backend-homolog.railway.internal:8080/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws {
            proxy_pass http://gestao-de-epi--backend-homolog.railway.internal:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            default_type text/plain;
            return 404 "A API SGE (Homologação) esta rodando em /api/";
        }
    }

    # ---------------------------------------------------------
    # 2. PRODUÇÃO / TENANTS: API Principal (*.radaptech.com.br)
    # ---------------------------------------------------------
    server {
        listen 80;
        server_name *.radaptech.com.br;

        location /api/ {
            limit_req zone=limite_api burst=10 nodelay;
            proxy_pass http://gestao-de-epi--backend.railway.internal:8080/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws {
            proxy_pass http://gestao-de-epi--backend.railway.internal:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            default_type text/plain;
            return 404 "A API SGE (Produção) esta rodando em /api/";
        }
    }
}